# Konfiguracja bazy H2 w pamięci
spring.datasource.url=jdbc:h2:mem:projekt_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Włączenie konsoli H2 (dostępna pod adresem http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# Hibernate i JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Wymuszenie uruchamiania skryptów schema.sql i data.sql przy każdym starcie
spring.sql.init.mode=always
