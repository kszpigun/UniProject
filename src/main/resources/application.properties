# Konfiguracja bazy H2 (w pamięci)
spring.datasource.url=jdbc:h2:mem:bazauczelni
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Konsola H2 - dostępna w przeglądarce pod adresem /h2-console
spring.h2.console.enabled=true

# Spring musi uruchomić schema.sql i data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Wyłączamy auto-generowanie tabel przez Hibernate, bo robimy to w schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
